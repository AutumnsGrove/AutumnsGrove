# AutumnsGrove — Personal website at autumnsgrove.com
# Workers deployment with shared Grove D1 backend for blog mirroring

name = "autumnsgrove"
compatibility_date = "2025-06-01"
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[vars]
TENANT_ID = "autumn-primary"

# Shared Grove D1 — blog posts, pages, tenant data
[[d1_databases]]
binding = "GROVE_DB"
database_name = "grove-engine-db"
database_id = "a6394da2-b7a6-48ce-b7fe-b1eb3e730e68"

# Shared Grove curios D1 — gallery, timeline, guestbook widgets
[[d1_databases]]
binding = "CURIO_DB"
database_name = "grove-curios-db"
database_id = "b03756ad-30d7-427a-9a1b-ec2f6478fcbd"

# Shared media bucket — tenant-prefixed image storage
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "grove-media"

# Cache KV namespace
[[kv_namespaces]]
binding = "CACHE_KV"
id = "514e91e81cc44d128a82ec6f668303e4"

# GroveAuth service binding — session validation, OAuth
[[services]]
binding = "GROVEAUTH"
service = "groveauth"
