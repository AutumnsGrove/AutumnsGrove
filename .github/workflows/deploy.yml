# NOTE: This workflow is DISABLED - AutumnsGrove repo is a personal profile only
# and doesn't actually deploy anything. Keeping the file for reference.
# To re-enable deployment: remove all "if: false" conditions from jobs below
#
# If it is ever re-enabled: the Cloudflare Pages project (autumns-grove) was deleted
# on 2026-11-23, so this repo deploys as a Worker via `wrangler deploy`, not Pages.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Top-level permissions for all jobs
permissions:
  contents: read
  packages: read
  deployments: write

jobs:
  # NOTE: Deployment disabled - this repo doesn't deploy (personal profile only)
  # To re-enable: remove the "if: false" condition below
  test:
    if: false
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security tests
        run: pnpm run test:security
        continue-on-error: true

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate test coverage
        run: pnpm run test:coverage
        continue-on-error: true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Get commit title
        id: commit
        run: echo "title=$(git log -1 --format=%s | head -c 100)" >> $GITHUB_OUTPUT

      - name: Deploy with wrangler (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy with wrangler (Preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
